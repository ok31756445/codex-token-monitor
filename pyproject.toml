[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-token-monitor"
version = "0.1.0"
description = "Read-only terminal monitor for Codex CLI session token usage"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ok31756445" }]
dependencies = []

[project.scripts]
codex-token-monitor = "codex_token_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

